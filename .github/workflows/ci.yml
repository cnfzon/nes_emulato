name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # 套件清單取自 eframe 0.36.2 官方 README「To use on Linux, first run:」
      # (https://docs.rs/crate/eframe/0.36.2 / crates.io 上的 README)。
      # rfd 0.17.2 預設用 xdg-portal（D-Bus）後端，不需要額外的 build-time
      # 系統套件；只有停用 xdg-portal、改用 `gtk3` feature 時才需要
      # libgtk-3-dev（見 rfd 的 crate 文件「Linux & BSD backends」章節），
      # 本專案沒有停用 xdg-portal，所以不裝它。
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
