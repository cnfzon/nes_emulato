[package]
name = "nes-net"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
log = "0.4.34"
nes-core = { version = "0.1.0", path = "../nes-core" }
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"

[dev-dependencies]
# 測試用的合成 ROM（`nes_core::test_support`）需要 `testing` feature；只有 nes-net 的測試啟用。
nes-core = { version = "0.1.0", path = "../nes-core", features = ["testing"] }
