[package]
name = "nes-app"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
eframe = "0.36"
egui = "0.36"
env_logger = "0.11.11"
log = "0.4.34"
nes-core = { version = "0.1.0", path = "../nes-core" }
nes-net = { version = "0.1.0", path = "../nes-net" }
rfd = "0.17.2"
rtrb = "0.4.0"
triple_buffer = "9"

[dev-dependencies]
# 測試用的合成 ROM（對輸入與 reset 敏感）在 `nes_core::test_support`，需要 `testing` feature。
nes-core = { version = "0.1.0", path = "../nes-core", features = ["testing"] }
