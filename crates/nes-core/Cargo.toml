[package]
name = "nes-core"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bitflags = { version = "2.13.2", features = ["serde"] }
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dev-dependencies]
serde_json = "1.0.151"

[features]
# 只給測試/除錯工具（例如 nes-test）用的 Nes API（override_pc、
# step_cpu_instruction、trace、peek），繞過一般的 run_frame 介面直接操作
# CPU。一般遊戲邏輯（nes-app）不啟用這個 feature。
testing = []
