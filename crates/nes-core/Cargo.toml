[package]
name = "nes-core"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bitflags = { version = "2.13.2", features = ["serde"] }
postcard = { version = "1.1.3", features = ["alloc", "use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[dev-dependencies]
serde_json = "1.0.151"

[features]
# 純測試用途的旁路 API（目前只有 `Nes::override_pc`）。Debugger 用的
# step_instruction / trace / peek 是正式公開 API，不在這個 feature 之後。
# 一般遊戲邏輯（nes-app）不啟用；注意 Cargo 的 feature 統一機制，見 README。
testing = []

# 這兩個範例用到 `test_support`（合成 ROM 產生器），需要 `testing` feature：
#   cargo run --release -p nes-core --features testing --example bench_run_frame
[[example]]
name = "bench_run_frame"
required-features = ["testing"]

[[example]]
name = "write_rendering_rom"
required-features = ["testing"]

[[example]]
name = "write_mapper_test_roms"
required-features = ["testing"]
